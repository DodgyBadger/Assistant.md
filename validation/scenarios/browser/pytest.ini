[pytest]
python_files = test_*.py
pythonpath = ../../..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
scenario_mode = protected
scenario_profile = browser
addopts = -p validation.support.pytest_policy -v --tb=short -n 1 --max-worker-restart=1 --browser chromium
