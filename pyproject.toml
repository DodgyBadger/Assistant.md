[project]
name = "project-assistant"
version = "0.1.0"
description = "Automated personal productivity system with AI-powered markdown workflows"
authors = [
    { name = "AssistantMD Team" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-ai[mistral,xai]==2.19.0",
    "pydantic-ai-harness[code-mode]==0.13.0",
    "fastapi>=0.100.0",
    "python-multipart",
    "logfire[fastapi,sqlalchemy]",
    "opentelemetry-sdk>=1.0.0",
    "apscheduler>=3.10.0",
    "python-dateutil>=2.8.2",
    "sqlalchemy>=2.0.0",
    "PyYAML>=6.0.0",
    "ddgs>=1.0.0",
    "tavily-python>=0.7.11",
    "httpx>=0.28.1,<0.29",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.12.0",
    "anyio>=3.7.0",
    "markdownify>=1.2.2",
    "markdown-it-py>=4.0.0",
    "playwright>=1.57.0",
    "pymupdf>=1.24.10",
    "pydantic-monty==0.0.21",
    "cryptography>=45.0.0",
    "fastmcp-slim[client]==3.4.0",
    "mcp==1.26.0",
    "httpcore>=1.0.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
target-version = ['py313']
line-length = 88

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "fitz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["validation"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "types-python-dateutil>=2.9.0.20260716",
    "types-pyyaml>=6.0.12.20260724",
    "types-requests>=2.32.4.20250809",
]
