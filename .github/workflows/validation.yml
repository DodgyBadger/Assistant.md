name: ci-validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CI_PYTHON_VERSION: "3.13"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright

jobs:
  security-audit:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_LINK_MODE: copy
      UV_COMPILE_BYTECODE: "1"
      UV_CACHE_DIR: ./.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies from lockfile
        run: npm ci

      - name: Audit npm dependencies (high+)
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync Python dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.UV_PROJECT_ENVIRONMENT }}
        run: uv sync --frozen --all-extras --no-install-project

      - name: Audit Python dependencies
        run: uv tool run --from pip-audit pip-audit --progress-spinner=off

  validation:
    needs: security-audit
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_LINK_MODE: copy
      UV_COMPILE_BYTECODE: "1"
      UV_CACHE_DIR: ./.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check root markdown allowlist
        run: |
          allowed='^(AGENTS|README|RELEASE_NOTES|THIRD_PARTY_NOTICES)\.md$'
          unexpected="$(find . -maxdepth 1 -type f -name '*.md' -printf '%f\n' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected root markdown files:"
            echo "$unexpected"
            echo
            echo "Move planning/design notes into docs/ or remove them before merge."
            exit 1
          fi

      - name: Install validation system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ripgrep

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Check vault mutation routing
        run: python scripts/check_vault_mutation_routing.py

      - name: Check principal resource routing
        run: python scripts/check_principal_resource_routing.py

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.UV_PROJECT_ENVIRONMENT }}
        run: uv sync --frozen --all-extras --no-install-project

      - name: Install Playwright Chromium
        run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m playwright install --with-deps chromium

      - name: Run deterministic core integration scenarios
        run: |
          ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python validation/run_validation.py run integration/core

      - name: Package validation artifacts
        if: ${{ always() }}
        run: tar -czf validation-runs.tar.gz validation/runs

      - name: Upload validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-runs
          path: validation-runs.tar.gz
          if-no-files-found: error
