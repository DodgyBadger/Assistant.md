name: ci-validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CI_PYTHON_VERSION: "3.13"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright

jobs:
  security-audit:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_LINK_MODE: copy
      UV_COMPILE_BYTECODE: "1"
      UV_CACHE_DIR: ./.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies from lockfile
        run: npm ci

      - name: Audit npm dependencies (high+)
        run: |
          node --test .github/tests/test_npm_audit_policy.cjs
          node scripts/audit-npm.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync Python dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.UV_PROJECT_ENVIRONMENT }}
        run: uv sync --frozen --all-extras --no-install-project

      - name: Check validation inventory
        run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m validation.support.inventory

      - name: Audit Python dependencies
        run: |
          # The commit-pinned harness has no registry artifact hash; retain its registry dependencies in the audit.
          uv export --frozen --all-extras --all-groups --no-emit-project --no-emit-package scenario-harness --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv tool run --from pip-audit pip-audit --progress-spinner=off --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"

      - name: Check repository validation admission policy
        run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m pytest -c .github/pytest.ini .github/tests/test_validation_policy.py .github/tests/test_pytest_collection_policy.py .github/tests/test_validation_governance_ci.py

  validation:
    needs: security-audit
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_LINK_MODE: copy
      UV_COMPILE_BYTECODE: "1"
      UV_CACHE_DIR: ./.uv-cache
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/assistantmd-tiktoken-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check root markdown allowlist
        run: |
          allowed='^(AGENTS|README|RELEASE_NOTES|THIRD_PARTY_NOTICES)\.md$'
          unexpected="$(find . -maxdepth 1 -type f -name '*.md' -printf '%f\n' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected root markdown files:"
            echo "$unexpected"
            echo
            echo "Move planning/design notes into docs/ or remove them before merge."
            exit 1
          fi

      - name: Install validation system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ripgrep

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Check vault mutation routing
        run: python scripts/check_vault_mutation_routing.py

      - name: Check principal resource routing
        run: python scripts/check_principal_resource_routing.py

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.UV_PROJECT_ENVIRONMENT }}
        run: uv sync --frozen --all-extras --no-install-project

      - name: Check validation inventory
        run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m validation.support.inventory

      - name: Install Playwright Chromium
        run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m playwright install --with-deps chromium

      - name: Prepare pinned tokenizer resource
        run: ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"

      - name: Run deterministic core integration scenarios
        run: |
          ${{ env.UV_PROJECT_ENVIRONMENT }}/bin/python -m pytest --scenario-root validation/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package validation artifacts
        if: ${{ always() }}
        run: tar -czf validation-runs.tar.gz validation/runs

      - name: Upload validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-runs
          path: validation-runs.tar.gz
          if-no-files-found: error
