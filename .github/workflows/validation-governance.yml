name: validation-governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: validation-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOVERNANCE_BASE: ${{ github.event.pull_request.base.sha }}
  GOVERNANCE_HEAD: ${{ github.event.pull_request.head.sha }}
  GOVERNANCE_PR: ${{ github.event.pull_request.number }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    outputs:
      review_required: ${{ steps.audit.outputs.review_required }}
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read candidate Git objects without checkout
        run: |
          git fetch --no-tags origin "refs/pull/${GOVERNANCE_PR}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$GOVERNANCE_HEAD"
      - name: Audit governance changes
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -S validation/support/ci/governance.py audit \
            --repo-path "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --pr-number "$GOVERNANCE_PR" --base-sha "$GOVERNANCE_BASE" --head-sha "$GOVERNANCE_HEAD"
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-audit-${{ github.event.pull_request.head.sha }}
          path: governance-audit.json
          if-no-files-found: warn

  approval:
    name: Approve governance changes
    needs: audit
    if: needs.audit.result == 'success' && needs.audit.outputs.review_required == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: validation-governance
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record manual authorization
        run: echo "Governance authorization granted for $GOVERNANCE_HEAD against $GOVERNANCE_BASE"

  finalize:
    if: always()
    needs: [audit, approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify authorization and current PR identity
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_AUDIT_RESULT: ${{ needs.audit.result }}
          GOVERNANCE_APPROVAL_RESULT: ${{ needs.approval.result }}
          GOVERNANCE_REVIEW_REQUIRED: ${{ needs.audit.outputs.review_required }}
        run: |
          python -I -S validation/support/ci/governance.py finalize \
            --repo-path "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --pr-number "$GOVERNANCE_PR" \
            --base-sha "$GOVERNANCE_BASE" --head-sha "$GOVERNANCE_HEAD" \
            --audit-result "$GOVERNANCE_AUDIT_RESULT" --approval-result "$GOVERNANCE_APPROVAL_RESULT" \
            --review-required "$GOVERNANCE_REVIEW_REQUIRED"
