[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scenario-harness"
version = "0.1.0"
description = "Project-configured scenarios with isolated execution and evidence"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
scenario-harness = "scenario_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scenario_harness"]
