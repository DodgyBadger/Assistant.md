# Assistant.md Settings Template
#
# This template seeds `system/settings.yaml` when no user configuration
# exists. Edit a copy under `system/settings.yaml` rather than this file.

settings:
  default_model:
    value: sonnet
    description: "Default model alias used in the chat UI and as fallback when workflow and context templates omit an explicit model."
    category: "Models"
    restart_required: false
  default_model_thinking:
    value: default
    description: "Default thinking policy for model calls. Use default, on, off, minimal, low, medium, high, or xhigh."
    category: "Models"
    restart_required: false
  default_context_script:
    value: "default.md"
    description: "Default context script name for chat sessions (vault scripts override system scripts by name)."
    category: "Chat"
    restart_required: false
  default_chat_mode:
    value: normal
    description: "Default mode for new chat sessions. Use normal or inline_edit."
    category: "Chat"
    restart_required: false
  disabled_tools:
    value: []
    description: "App-wide tool names to disable. All registered tools not listed here are available to chat, delegates, workflows, and scripts."
    category: "Chat"
    restart_required: false
  web_search_strategy:
    value: duckduckgo
    description: "Strategy used by web_search. Built-in options: duckduckgo or tavily."
    category: "Browser and API"
    restart_required: false
  web_extract_strategy:
    value: curl
    description: "Strategy used by web_extract. Built-in options: curl or tavily."
    category: "Browser and API"
    restart_required: false
  web_crawl_strategy:
    value: tavily
    description: "Strategy used by web_crawl. Currently supported: tavily."
    category: "Browser and API"
    restart_required: false
  chat_tool_calls_limit:
    value: 0
    description: "Maximum tool calls allowed in one chat response. 0 disables the limit. Set a low value to force tighter tool use or encourage code_execution for batch work."
    category: "Chat"
    restart_required: false
  chat_model_requests_limit:
    value: 150
    description: "Maximum model requests allowed in one chat response. 0 disables the limit. This is a circuit breaker for runaway long-running tasks, separate from tool-call limits."
    category: "Chat"
    restart_required: false
  persist_model_reasoning_parts:
    value: false
    description: "Persist provider reasoning/thinking parts in durable chat history. Disabled by default to keep history portable across providers and avoid replaying extra reasoning tokens. Enabling this can increase token usage and make old turns less portable when switching models."
    category: "Chat"
    restart_required: false
  delegate_tool_calls_limit:
    value: 32
    description: "Maximum tool calls allowed inside one delegate child-agent run. 0 disables the limit. Increase for broad delegated searches, or lower it to force tighter scoped delegation."
    category: "Delegation"
    restart_required: false
  delegate_model_requests_limit:
    value: 75
    description: "Maximum model requests allowed inside one delegate child-agent run. 0 disables the limit. Keep at least one of the model-request, tool-call, or timeout delegate limits enabled to retain runaway protection."
    category: "Delegation"
    restart_required: false
  delegate_repeated_failure_limit:
    value: 2
    description: "Maximum consecutive executions of one delegate child tool with identical arguments that may return structured failures before later unchanged attempts are blocked. 0 disables this guard."
    category: "Delegation"
    restart_required: false
  delegate_timeout_seconds:
    value: 120
    description: "Maximum seconds allowed for one delegate child-agent run. 0 disables the delegate timeout. Increase for broad delegated searches or slower models."
    category: "Delegation"
    restart_required: false
  model_stream_retries:
    value: 1
    description: "Retries after a retryable model-stream disconnection in tool-free primary chat and delegate runs. 0 disables automatic retries. Retries only run when the runtime can prove replay will not duplicate tool side effects."
    category: "Resilience"
    restart_required: false
  model_stream_retry_base_delay_seconds:
    value: 1.0
    description: "Initial delay in seconds before retrying a retryable model-stream disconnection. Later retries use bounded exponential backoff."
    category: "Resilience"
    restart_required: false
  model_stream_retry_max_delay_seconds:
    value: 10.0
    description: "Maximum delay in seconds between model-stream retry attempts."
    category: "Resilience"
    restart_required: false
  default_api_timeout:
    value: 120
    description: "Default timeout in seconds for external API calls."
    category: "Browser and API"
    restart_required: false
  openrouter_ignored_providers:
    value:
      - azure
    description: "OpenRouter provider slugs to skip for model calls. Default avoids known Azure routing compatibility issues with tool-using chats; set [] if your OpenRouter account intentionally routes through Azure."
    category: "Models"
    restart_required: false
  openai_oauth_enabled:
    value: false
    description: "Enable experimental OpenAI OAuth connection controls. When false, OpenAI runs in API-key-only mode even if OAuth metadata or tokens exist."
    category: "Advanced"
    restart_required: false
  editable_builtin_providers:
    value: []
    description: "Built-in provider names that may expose advanced metadata editing. Leave empty unless you intentionally need to edit protected provider entries."
    category: "Advanced"
    restart_required: false
  workflow_task_timeout_seconds:
    value: 0
    description: "Maximum seconds for one workflow execution task. 0 disables the workflow task timeout."
    category: "Workflows"
    restart_required: false
  max_concurrent_workflows:
    value: 0
    description: "Maximum number of workflows allowed to run at the same time across all vaults. 0 disables the global workflow concurrency limit."
    category: "Workflows"
    restart_required: false
  mcp_max_concurrent_advanced_shell_stdio_launches:
    value: 4
    description: "Maximum advanced-shell stdio providers Assistant.md may initialize concurrently. This bounds managed MCP launch fan-out, not commands started directly through the shell tool."
    category: "Advanced"
    restart_required: true
  browser_navigation_timeout_seconds:
    value: 20
    description: "Navigation timeout in seconds for the browser extraction tool."
    category: "Browser and API"
    restart_required: false
  browser_selector_timeout_seconds:
    value: 4
    description: "Selector wait timeout in seconds for the browser extraction tool."
    category: "Browser and API"
    restart_required: false
  browser_max_concurrent_sessions:
    value: 1
    description: "Maximum Chromium sessions allowed at once. Keep at 1 on the standard 2 GB deployment profile."
    category: "Browser and API"
    restart_required: false
  browser_max_calls_per_turn:
    value: 4
    description: "Maximum browser calls in one execution task. 0 disables this browser-specific circuit breaker."
    category: "Browser and API"
    restart_required: false
  browser_min_memory_headroom_mb:
    value: 512
    description: "Minimum cgroup memory headroom required before launching Chromium. 0 disables launch admission checks."
    category: "Browser and API"
    restart_required: false
  max_output_tokens:
    value: 0
    description: "Maximum output tokens for model responses. 0 = provider default. Increase if you experience errors on file_write calls."
    category: "Models"
    restart_required: false
  auto_cache_max_tokens:
    value: 50000
    description: "When chat tool output exceeds this estimated token count, store it in cache and return a compact preview plus cache ref instead of inlining the full payload. 0 = disabled. Caution: very low values will increase tool churn and token usage."
    category: "Chat"
    restart_required: false
  compaction_type:
    value: auto
    description: "Chat history compaction policy: auto, suggested, or none. Auto is recommended for long-running tasks; suggested or none may reduce reliability as context grows. To compact less often, increase compaction_token_threshold first."
    category: "Chat"
    restart_required: false
  compaction_keep_recent:
    value: 8
    description: "Target number of recent raw chat messages to preserve verbatim when compacting history."
    category: "Chat"
    restart_required: false
  compaction_token_threshold:
    value: 80000
    description: "Estimated chat-history token threshold for suggested or automatic compaction. Increase this first if automatic compaction happens too often."
    category: "Chat"
    restart_required: false
  file_search_timeout_seconds:
    value: 10
    description: "Timeout in seconds for file_read search operations."
    category: "Files"
    restart_required: false
  file_list_max_results:
    value: 200
    description: "Maximum number of results returned by file_read list operations. 0 = disabled."
    category: "Files"
    restart_required: false
  vault_upload_max_mb_per_file:
    value: 100
    description: "Maximum size in MB for one Vault Explorer file upload. 0 disables Vault Explorer uploads."
    category: "Files"
    restart_required: false
  vault_state_enabled:
    value: true
    description: "Enable vault-state manifest refresh and change-feed maintenance."
    category: "Vault State"
    restart_required: false
  vault_state_excluded_patterns:
    value:
      - ".git/"
      - "**/.DS_Store"
      - "**/__pycache__/"
      - "AssistantMD/Chat_Sessions/"
    description: "Gitignore-style vault-relative path patterns excluded from vault-state manifests and change feeds."
    category: "Vault State"
    restart_required: false
  vault_scan_interval_seconds:
    value: 0
    description: "Interval in seconds for scheduled vault-state refresh. 0 disables scheduled refresh."
    category: "Vault State"
    restart_required: false
  task_rollback_enabled:
    value: true
    description: "Enable task-scoped mutation snapshots for supported rollback operations."
    category: "Vault State"
    restart_required: false
  task_mutation_retention_days:
    value: 365
    description: "Days to retain task mutation audit rows before cleanup."
    category: "Vault State"
    restart_required: false
  task_snapshot_retention_days:
    value: 30
    description: "Days to retain task snapshot metadata and files before cleanup."
    category: "Vault State"
    restart_required: false
  chunking_max_images_per_prompt:
    value: 20
    description: "Maximum number of images that may be attached from chunked markdown inputs in a single prompt. 0 = disabled."
    category: "Chunking"
    restart_required: false
  chunking_max_image_mb_per_image:
    value: 5
    description: "Maximum size in MB for a single image attachment from chunked markdown inputs. 0 = disabled."
    category: "Chunking"
    restart_required: false
  chunking_max_image_mb_total:
    value: 100
    description: "Maximum total MB allowed for all chunked image attachments in a single prompt. 0 = disabled."
    category: "Chunking"
    restart_required: false
  chunking_allow_remote_images:
    value: false
    description: "Allow remote image URLs in markdown chunking (currently ref-only behavior; no download/attach)."
    category: "Chunking"
    restart_required: false
  debug:
    value: false
    description: "Enable verbose API error responses and diagnostic detail logging. Restart required."
    category: "System"
    restart_required: true
  logfire:
    value: false
    description: "Enable Logfire telemetry when LOGFIRE_TOKEN is set."
    category: "System"
    restart_required: false
  ingestion_pdf_default_strategies:
    value:
      - pdf_ocr
      - pdf_text
    description: "Available strategies and priority for PDF ingestion. JSON array. OCR is recommended first when configured; unavailable strategies are skipped. Remove a value to disable it or reorder as needed. E.g. [\"pdf_ocr\"] forces all imports through OCR."
    category: "Import"
    restart_required: false
  ingestion_ocr_model:
    value: "mistral-ocr-latest"
    description: "Model used for ingestion OCR extraction."
    category: "Import"
    restart_required: false
  ingestion_ocr_endpoint:
    value: "https://api.mistral.ai/v1/ocr"
    description: "HTTP endpoint for ingestion OCR extraction."
    category: "Import"
    restart_required: false
  ingestion_ocr_capture_images:
    value: false
    description: "When true, request OCR image payloads and persist them as assets during ingestion."
    category: "Import"
    restart_required: false
  ingestion_ocr_timeout_seconds:
    value: 120
    description: "Maximum time in seconds to wait for one OCR provider request. Increase this for large or complex documents."
    category: "Import"
    restart_required: false
  ingestion_image_default_strategies:
    value:
      - image_ocr
    description: "Available strategies and priority for image ingestion. JSON array. Remove value to disable or reorder as needed."
    category: "Import"
    restart_required: false
  ingestion_output_path_pattern:
    value: "Imported/"
    description: "Vault-relative path where imports are written."
    category: "Import"
    restart_required: false
  ingestion_url_fetch_strategy:
    value: "curl"
    description: "URL transport strategy used by ingestion. Currently supported: curl."
    category: "Import"
    restart_required: false
  ingestion_url_connect_timeout_seconds:
    value: 10
    description: "Connection timeout in seconds for URL ingestion HTTP requests. Increase if you get timeout errors on large URL imports."
    category: "Import"
    restart_required: false
  ingestion_url_read_timeout_seconds:
    value: 20
    description: "Read timeout in seconds for URL ingestion HTTP requests. Increase if you get timeout errors on large URL imports."
    category: "Import"
    restart_required: false
  ingestion_url_max_response_mb:
    value: 25
    description: "Maximum response body size in megabytes for one URL ingestion request. The 25 MB default accommodates typical research PDFs; lower it for tighter memory limits."
    category: "Import"
    restart_required: false
  content_import_max_batch_size:
    value: 20
    description: "Maximum number of sources or job ids accepted by one content_import tool call."
    category: "Import"
    restart_required: false
  ingestion_worker_interval_seconds:
    value: 120
    description: "How often the ingestion worker runs (seconds)."
    category: "Import"
    restart_required: true
  ingestion_worker_batch_size:
    value: 5
    description: "Number of ingestion jobs to process per worker run."
    category: "Import"
    restart_required: true

