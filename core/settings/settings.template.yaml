providers:
  google:
    api_key: GOOGLE_API_KEY
    base_url: null
    user_editable: false
  grok:
    api_key: GROK_API_KEY
    base_url: null
    user_editable: false
  anthropic:
    api_key: ANTHROPIC_API_KEY
    base_url: null
    user_editable: false
  openai:
    api_key: OPENAI_API_KEY
    base_url: null
    auth_mode: api_key
    oauth_api_key_fallback_enabled: false
    user_editable: false
  mistral:
    api_key: MISTRAL_API_KEY
    base_url: null
    user_editable: false
  openrouter:
    api_key: OPENROUTER_API_KEY
    base_url: null
    provider:
      require_parameters: true
    user_editable: false
  lm_studio:
    api_key: LM_STUDIO_API_KEY
    base_url: LM_STUDIO_BASE_URL
    user_editable: true
  ollama:
    api_key: OLLAMA_API_KEY
    base_url: OLLAMA_BASE_URL
    user_editable: true

tools:
  gmail:
    module: core.tools.gmail
    description: "Read connected Gmail accounts, save bounded PDF attachments, and create unsent drafts when enabled"
    requires_secrets: []
    requires_connection: google.gmail.read
    user_editable: false
    chat_visible: true
  content_import:
    module: core.tools.content_import
    description: "Import URLs or vault files to durable Markdown immediately by default, or queue and inspect background jobs"
    requires_secrets: []
    user_editable: false
  web_search:
    module: core.tools.web_search
    description: "Search the web using the configured strategy"
    requires_secrets: []
    user_editable: false
  web_extract:
    module: core.tools.web_extract
    description: "Extract readable content from known URLs using the configured strategy"
    requires_secrets: []
    user_editable: false
  web_crawl:
    module: core.tools.web_crawl
    description: "Crawl related website pages using the configured strategy"
    requires_secrets: []
    user_editable: false
  file_read:
    module: core.tools.file_read
    description: "Read, list, search, and inspect frontmatter in the current vault"
    requires_secrets: []
    user_editable: false
  file_write:
    module: core.tools.file_write
    description: "Create, append, edit lines, replace text, move, delete, and create folders in the current vault"
    requires_secrets: []
    user_editable: false
  browser:
    module: core.tools.browser
    description: "Browser-based extraction for dynamic pages that require Chromium"
    requires_secrets: []
    user_editable: false
  workflow_run:
    module: core.tools.workflow_run
    description: "List, run, enable, and disable workflows in the current vault"
    requires_secrets: []
    user_editable: false
  code_execution:
    module: core.tools.code_execution
    description: "Run constrained local Python against the current chat cache namespace"
    requires_secrets: []
    user_editable: false
    chat_visible: true
  delegate:
    module: core.tools.delegate
    description: "Run a bounded child agent for focused model reasoning or limited tool exploration"
    requires_secrets: []
    user_editable: false
    chat_visible: true
  chat_history_compact:
    module: core.tools.chat_history_compact
    description: "Check or compact the current chat session history"
    requires_secrets: []
    user_editable: false
    chat_visible: true
  session_ops:
    module: core.tools.session_ops
    description: "Search and summarize chat sessions"
    requires_secrets: []
    user_editable: false
    chat_visible: true
  goal_ops:
    module: core.tools.goal_ops
    description: "Track durable goals, ordered steps, events, and checkpoints"
    requires_secrets: []
    user_editable: false
    chat_visible: true
